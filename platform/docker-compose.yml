# Swiss Job Agent platform: gateway (public, port 8090) + provisioner (Docker socket, internal).
# Tenants are NOT in this file: the provisioner creates them (jat-<slug>-web / -sched).
# Install: platform/install.sh   Upgrade (platform + every tenant): platform/upgrade.sh
name: jobplatform

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "5m", max-file: "3" } }

services:
  gateway:
    <<: *hardening
    build: .
    image: jobplatform:latest
    container_name: jobplatform-gateway
    command: ["uvicorn", "jobplatform.gateway:app", "--host", "0.0.0.0", "--port", "8090",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: .env
    environment:
      PLATFORM_DB: /state/platform.db
      PROVISIONER_URL: http://provisioner:8091
    user: "1000:1000"
    ports: ["8090:8090"]
    volumes: [state:/state]
    networks: [platform]
    depends_on: [provisioner]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/_platform/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s

  provisioner:
    <<: *hardening
    image: jobplatform:latest
    container_name: jobplatform-provisioner
    command: ["uvicorn", "jobplatform.provisioner:app", "--host", "0.0.0.0", "--port", "8091"]
    env_file: .env
    environment:
      GATEWAY_CONTAINER: jobplatform-gateway
      ARCHIVE_DIR: /archives
      BACKUP_DIR: /backups
    # root inside the container only to use the Docker socket; no capabilities, not published
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - archives:/archives
      # nightly backups of every workspace: a folder of the host (point it at a NAS mount to keep them off this machine)
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    networks: [platform]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s

  # One crawler for everybody: the shared sources are queried once, into one database of postings
  # (public data only); each workspace takes what matches its owner. Runs the app image.
  collector:
    <<: *hardening
    image: ${TENANT_IMAGE:-swiss-job-agent:latest}
    container_name: jobplatform-collector
    command: ["python", "-m", "app.collector"]
    env_file: .env
    environment:
      DB_PATH: /data/pool.db
      WATCHLIST_PATH: /data/watchlist.json
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      CF_TEAM_DOMAIN: ""
      CF_ACCESS_AUD: ""
    # root inside the container only to own its data volume; no capabilities, not published
    user: "0:0"
    volumes: [pool:/data]
    networks: [platform]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s

volumes:
  state: {}
  archives: {}
  pool: {}

networks:
  platform: {}
