<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Swiss Job Agent{% endblock %}</title>
<script>
  // day or night colours: the person's choice (kept in this browser), else what their device uses
  (function () { var t; try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t); })();
</script>
<style>
  :root { --bg:#0f1419; --card:#1a1f29; --fg:#e6e6e6; --muted:#8a94a6; --accent:#4a9eff; --border:#2a3240; --bad:#ffa3a8; --ok:#8ee6a4; --input:#0f1419; --danger:#8b2a31; --soft:rgba(74,158,255,.08); }
  html[data-theme="light"] { --bg:#f4f6f9; --card:#ffffff; --fg:#1b2330; --muted:#5a6575; --accent:#1f6fd6; --border:#d5dbe4; --bad:#b3261e; --ok:#18794e;
          --input:#ffffff; --danger:#b3261e; --soft:rgba(31,111,214,.08); }
  * { box-sizing:border-box; } body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } a { color:var(--accent); text-decoration:none; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:12px; overflow-x:auto; }
  .muted { color:var(--muted); font-size:13px; } input,select,textarea { padding:8px; background:var(--input); border:1px solid var(--border); border-radius:6px; color:var(--fg); font:inherit; }
  button,.btn { display:inline-block; padding:8px 14px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font:inherit; }
  .ghost { background:transparent; border:1px solid var(--border); color:var(--fg); } .danger { background:var(--danger); }
  .small { padding:3px 9px; font-size:13px; } table { width:100%; border-collapse:collapse; font-size:14px; }
  td,th { padding:5px 8px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; } th { color:var(--muted); font-size:12px; }
  .langs a { padding:2px 4px; font-size:18px; border-radius:6px; opacity:.45; } .langs a.on { opacity:1; background:var(--border); } .langs a:hover { opacity:1; }
  .themebtn { background:transparent; padding:2px 6px; font-size:17px; line-height:1.2; min-height:0; border-radius:6px; }
  .themebtn:hover { background:var(--border); } html[data-theme="light"] .themebtn .sun, html:not([data-theme="light"]) .themebtn .moon { display:none; }
  form.inline { display:inline; } .ok { color:var(--ok); } .bad { color:var(--bad); } code { word-break:break-all; }
</style></head>
<body><header><h1><a href="/" style="color:var(--fg)">🇨🇭 Swiss Job Agent</a></h1>
<button type="button" class="themebtn" style="margin-left:auto" title="Day / night colours" aria-label="Day / night colours"><span class="sun">☀️</span><span class="moon">🌙</span></button>
<span class="langs">{% for code, flag, name in [("en", "🇬🇧", "English"), ("fr", "🇫🇷", "Français"), ("de", "🇩🇪", "Deutsch"), ("it", "🇮🇹", "Italiano")] %}<a href="/welcome/lang/{{ code }}?next={{ request.url.path }}" class="{{ 'on' if code == ui_lang }}" title="{{ name }}" aria-label="{{ name }}">{{ flag }}</a>{% endfor %}</span>
<span class="muted">{% block nav %}{% endblock %}{{ email }}{% if is_admin %} · <a href="/_platform/admin">admin</a>{% endif %}</span></header>
<div class="wrap">{% block body %}{% endblock %}</div>
<script>
  document.querySelectorAll(".themebtn").forEach(function (b) {          // sun / moon button of the top bar
    b.addEventListener("click", function () {
      var t = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("theme", t); } catch (e) {}
    });
  });
</script>
</body></html>
